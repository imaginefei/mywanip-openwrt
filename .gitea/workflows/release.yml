# Gitea Actions 发布工作流
#
# 自动触发：推送 v* tag → 构建并创建 Release。
# 手动触发：仓库 Actions 页面选中 release 工作流 → Run workflow，
#           输入要补发/重发的 tag（如 v1.0.0）。
#
# 与 GitHub 版（.github/workflows/release.yml）功能一致，差异点：
#   - Gitea 从 .gitea/workflows/ 读取工作流
#   - 制品上传用 Gitea 官方 CLI（tea）：创建/补传 Release 附件，幂等可重跑
#   - tea 优先用 runner 挂载缓存 /opt/tea-cache（宿主一次下载永久复用），
#     缓存不可用时回退到 gitea.com 下载
#
# 前提：
#   1. Gitea >= 1.21，Actions 默认启用
#   2. 已注册 runner（管理后台 -> Actions -> Runners）
#   3. 仓库设置 -> 启用仓库 Actions
name: release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建发布的 tag，如 v1.0.0'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: 单元测试
        run: go test ./...

      - name: 交叉编译与打包
        run: |
          make build
          make ipk

      - name: 用 tea CLI 创建 Release 并上传 ipk
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}   # Gitea 自动注入的仓库 token（兼容名）
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -e

          # 1. 准备 tea：优先 runner 挂载缓存(/opt/tea-cache)，缺失才从 gitea.com 下载
          TEA=/opt/tea-cache/tea
          if [ -x "${TEA}" ]; then
            echo "== 使用挂载缓存 tea: ${TEA} =="
          else
            echo "== 缓存未命中，从 gitea.com 下载 tea =="
            curl -sL --max-time 300 -o /tmp/tea \
              "https://gitea.com/gitea/tea/releases/download/v0.15.1/tea-0.15.1-linux-amd64"
            chmod +x /tmp/tea
            TEA=/tmp/tea
          fi
          "${TEA}" --version

          # 2. 登录（url 需与 actions/checkout 的 remote 一致 = 实例地址）
          "${TEA}" login add --name ci \
            --url "${GITHUB_SERVER_URL}" --token "${TOKEN}" --no-version-check

          # 3. 创建 Release；已存在则忽略（幂等，可重跑）
          if ! "${TEA}" releases create "${TAG}" --title "${TAG}" --note "Release ${TAG}"; then
            echo "== Release ${TAG} 已存在，跳过创建 =="
          fi

          # 4. 补传缺失的 ipk（已有同名附件则跳过）
          EXISTING=$("${TEA}" releases assets list "${TAG}" -o json | jq -r '.[].name')
          for f in release/*/*.ipk; do
            NAME=$(basename "${f}")
            if echo "${EXISTING}" | grep -qx "${NAME}"; then
              echo "skip (已存在): ${NAME}"
              continue
            fi
            "${TEA}" releases assets create "${TAG}" "${f}"
            echo "uploaded: ${NAME}"
          done
          echo "== 全部完成 =="
