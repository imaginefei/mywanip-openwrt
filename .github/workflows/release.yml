# 发布工作流
#
# 自动触发：推送 v* tag → 构建并创建 Release。
# 手动触发：Actions 页面 Run workflow（或 gh workflow run），输入要
# 补发/重发的 tag（如 v1.0.0）——用于 workflow 加入仓库之前打的旧 tag。
#
# 流程：checkout 指定 tag → 装 Go → 测试 → 交叉编译 → 打 ipk →
#       创建/更新 Release 并把 release/ 下的 ipk 全部挂为制品。
# 产物版本号由 git describe 自动取得（即 tag 本身），与本地构建一致。
name: release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建发布的 tag，如 v1.0.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: 单元测试
        run: go test ./...

      - name: 交叉编译与打包
        run: |
          make build
          make ipk

      - name: 创建 Release 并上传 ipk 制品
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: release/**/*.ipk
          generate_release_notes: true
